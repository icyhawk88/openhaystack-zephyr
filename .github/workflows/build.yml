name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: zephyrprojectrtos/ci:l
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: openhaystack-zephyr
      - name: Initialize
        working-directory: openhaystack-zephyr
        run: |
          pip3 install -U west
          west init -l .
          west update
          pip3 install -r ../zephyr/scripts/requirements-base.txt
      - name: Install Zephyr toolchain
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.13.2/zephyr-sdk-0.13.2-linux-x86_64-setup.run
          chmod +x zephyr-sdk-0.13.2-linux-x86_64-setup.run
          ./zephyr-sdk-0.13.2-linux-x86_64-setup.run -- -d ~/zephyr-sdk-0.13.2
      - name: Build firmware
        working-directory: openhaystack-zephyr
        run: |
          west build -b bbc_microbit_v2 -s app
      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openhaystack-zephyr/build/zephyr/zephyr.*
